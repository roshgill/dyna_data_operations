<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dyna Ops: Encord Automations</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <h1>Dyna Ops: Encord Automations</h1>
      </header>

      <section class="panel">
        <p class="meta">[ CAMERA LAYOUT ]</p>
        <p class="hint">
          Arrange camera layout to your preference, then save. Click the toolbar icon to restore them for
          new episodes.
        </p>
        <label class="switch-row auto-layout-row">
          <input id="auto-layout" type="checkbox" role="switch" />
          <span class="switch" aria-hidden="true"></span>
          <span>Auto-layout after page loads</span>
        </label>
        <div class="actions">
          <button id="restore" type="button" class="primary">
            Restore layout<span class="dot-arrow" aria-hidden="true">···</span>
          </button>
          <button id="save" type="button">Save layout</button>
        </div>
      </section>

      <section class="panel">
        <p class="meta">[ ANNOTATION ]</p>
        <p class="hint">
          Applies incomplete Grade/Step annotations after last step is on the timeline
        </p>
        <label class="switch-row">
          <input id="auto-grade" type="checkbox" role="switch" checked />
          <span class="switch" aria-hidden="true"></span>
          <span>Auto-annotate after last Step (Esc/Done)</span>
        </label>
        <p id="grade-status" class="hint compact" aria-live="polite"></p>
        <div class="actions">
          <button id="grade-sync" type="button">Annotate now</button>
        </div>
      </section>

      <section class="feedback">
        <p id="status" class="status" aria-live="polite"></p>
      </section>

      <footer class="foot">
        <span class="meta">v0.18.48</span>
      </footer>
    </main>
    <script src="layout-ops.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
