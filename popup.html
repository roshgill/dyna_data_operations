<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Encord Camera Layout</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <h1>Encord Camera Layout</h1>
        <p class="hint">Arrange panes, then save. Click the toolbar icon anytime to restore.</p>
      </header>

      <div class="actions">
        <button id="restore" type="button" class="primary">
          Restore layout<span class="dot-arrow" aria-hidden="true">···</span>
        </button>
        <button id="save" type="button">Save layout</button>
      </div>

      <section class="feedback">
        <p id="status" class="status" aria-live="polite"></p>
      </section>

      <footer class="foot">
        <span class="meta">v0.9</span>
      </footer>
    </main>
    <script src="layout-ops.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
